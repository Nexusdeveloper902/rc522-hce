name: CD

# Boom: a green CI on a push to main cuts a release automatically.
# Flow: bump `version` in library.json (+ library.properties to match),
# push to main, CI goes green → this workflow tags v<version> and creates
# the GitHub release. If the tag already exists it exits quietly, so
# re-runs and non-version pushes never spam releases.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (default: library.json at main)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Release on green main
    runs-on: ubuntu-latest
    # Only act on successful CI for pushes to main — never on PR runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Resolve the exact commit CI tested
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=main" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(python3 -c "import json;print(json.load(open('library.json'))['version'])")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from ${{ steps.target.outputs.sha }}"
      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh release create "$TAG" --target "$SHA" \
            --title "$TAG" --generate-notes
