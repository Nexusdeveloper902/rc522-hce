name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (pure C++, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install PlatformIO Core into a venv (PEP 668 safe on 24.04)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip platformio
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: pio test -e native
        run: pio test -e native

  cross-compile:
    name: Cross-compile (${{ matrix.board }} / ${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, megaatmega2560]
        example: [BasicTap, HceEnroll]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install PlatformIO Core into a venv (PEP 668 safe on 24.04)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip platformio
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build exactly like a consumer does (library in lib/, sketch in src/)
        env:
          BOARD: ${{ matrix.board }}
          EXAMPLE: ${{ matrix.example }}
        run: |
          rm -rf /tmp/consumer && mkdir -p /tmp/consumer/src /tmp/consumer/lib
          cp "examples/${EXAMPLE}/${EXAMPLE}.ino" /tmp/consumer/src/main.cpp
          ln -s "$GITHUB_WORKSPACE" /tmp/consumer/lib/RC522-HCE
          deps="miguelbalboa/MFRC522@^1.4.11"
          if [ "$BOARD" = "megaatmega2560" ]; then
            # 8-bit AVR toolchain ships no C++ stdlib, hence the shim
            deps="$deps
                  mike-matera/ArduinoSTL@^1.3.3"
          fi
          cat > /tmp/consumer/platformio.ini <<EOF
          [env:board]
          platform = $([ "$BOARD" = "esp32dev" ] && echo espressif32 || echo atmelavr)
          framework = arduino
          board = ${BOARD}
          build_flags = -DMFRC522_SPICLOCK=1000000u
          lib_deps =
          $(echo "$deps" | sed 's/^/    /')
          EOF
          cat /tmp/consumer/platformio.ini
          pio run -d /tmp/consumer -e board

  rewire-by-build-flags:
    name: Rewire via build flags only (ESP32-CAM pins, custom AID)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install PlatformIO Core into a venv (PEP 668 safe on 24.04)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip platformio
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Pins, timings and (runtime) AID change without touching source
        run: |
          rm -rf /tmp/flags && mkdir -p /tmp/flags/src /tmp/flags/lib
          ln -s "$GITHUB_WORKSPACE" /tmp/flags/lib/RC522-HCE
          cat > /tmp/flags/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <HceReader.h>
          #include <Rc522HceReader.h>

          // Pins come from build flags below, never from library source.
          rc522hce::Rc522HceReader radio;
          rc522hce::HceReader reader(radio);

          void setup() {
            Serial.begin(115200);
            reader.begin();
            const uint8_t myAid[] = {0xD1, 0x76, 0x00, 0x00, 0x85};
            reader.setAid(myAid, sizeof(myAid));  // AID changed at runtime
          }
          void loop() {
            rc522hce::HceReader::Tap tap;
            if (reader.read(tap, millis())) { Serial.println(tap.credentialId.c_str()); }
          }
          EOF
          cat > /tmp/flags/platformio.ini <<'EOF'
          [env:esp32cam]
          platform = espressif32
          framework = arduino
          board = esp32cam
          monitor_dtr = 0
          monitor_rts = 0
          build_flags =
              -DRC522HCE_SS_PIN=13
              -DRC522HCE_RST_PIN=255      ; RST strapped to 3V3
              -DRC522HCE_SCK_PIN=14
              -DRC522HCE_MISO_PIN=2
              -DRC522HCE_MOSI_PIN=15
              -DRC522HCE_DEBOUNCE_MS=1500
          lib_deps =
              miguelbalboa/MFRC522@^1.4.11
          EOF
          pio run -d /tmp/flags -e esp32cam

  meta:
    name: Repo conventions (versions in sync, conventional commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: library.json and library.properties agree
        run: |
          J="$(python3 -c "import json;print(json.load(open('library.json'))['version'])")"
          P="$(grep -E '^version=' library.properties | cut -d= -f2)"
          echo "library.json=$J library.properties=$P"
          [ "$J" = "$P" ] || { echo "Version mismatch — bump both files together."; exit 1; }
      - name: Conventional commit messages / PR title
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PAT='^((feat|fix|docs|test|ci|cd|security|chore|refactor|perf|build|style|revert)(\([^)]+\))?!?: .+|Merge .+|Release .+)$'
          fail=0
          if [ "$EVENT" = "pull_request" ]; then
            echo "PR title: $TITLE"
            echo "$TITLE" | grep -qiE "$PAT" || { echo "Title is not Conventional Commits."; exit 1; }
          else
            MSGS="$(git log --format=%s HEAD --not --remotes --max-count=20 2>/dev/null)"
            [ -z "$MSGS" ] && echo "(no local-only commits to lint)"
            while IFS= read -r s; do
              [ -z "$s" ] && continue
              echo "$s" | grep -qiE "$PAT" || { echo "NOT conventional: $s"; fail=1; }
            done <<< "$MSGS"
            exit $fail
          fi

  sanitizers:
    name: Host tests under ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install PlatformIO Core into a venv (PEP 668 safe on 24.04)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip platformio
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: pio test -e native-san
        run: pio test -e native-san

  fuzz:
    name: Fuzz wire parsers (libFuzzer, 60 s each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Build + run all fuzz targets (any crash fails the job)
        run: |
          for t in challenge enroll unhex strip verify aead; do
            clang++ -std=c++11 -g -O1 -fsanitize=fuzzer,address -Isrc \
              -o /tmp/fuzz_$t fuzz/fuzz_$t.cpp src/HceProtocol.cpp
            /tmp/fuzz_$t fuzz/corpus/$t -max_total_time=60 -print_final_stats=1
          done

  coverage:
    name: Native coverage gate (>= 90% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install PlatformIO Core + gcovr into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip platformio gcovr
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: pio test -e native-cov, then enforce the gate
        run: |
          pio test -e native-cov
          gcovr --root . --filter 'src/.*' --fail-under-line 90 --print-summary

  hil-build:
    name: HIL suite compiles for ESP32 (no hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install PlatformIO Core into a venv (PEP 668 safe on 24.04)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip platformio
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Compile every test TU for the MCU (catches host-only drift)
        run: |
          rm -rf /tmp/hilbuild && mkdir -p /tmp/hilbuild/src /tmp/hilbuild/inc
          cp test/*.cpp /tmp/hilbuild/src/
          cp src/HceProtocol.cpp /tmp/hilbuild/src/
          cp src/*.h /tmp/hilbuild/inc/
          cat > /tmp/hilbuild/platformio.ini <<'EOF'
          [env:hil]
          platform = espressif32
          framework = arduino
          board = esp32dev
          build_flags =
              -DMFRC522_SPICLOCK=1000000u
              -Iinc
          lib_deps =
              miguelbalboa/MFRC522@^1.4.11
              throwtheswitch/Unity@^2.6.1
          EOF
          pio run -d /tmp/hilbuild -e hil

  backend-test:
    name: Reference backend tests (stdlib unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: python3 -m unittest (no dependencies)
        working-directory: extras/reference-backend
        run: python3 -m unittest test_hce_backend -v

  arduino-lint:
    name: Arduino Lint (library-manager submit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: arduino/arduino-lint-action@9a3603836c75e41753e531167395edeb90ba5dae  # v3.0.0
        with:
          version: 1.3.0
          library-manager: submit
          compliance: permissive

  workflow-lint:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: zizmor stays clean
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet zizmor==1.30.1
          .venv/bin/zizmor .github/workflows/

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [host-tests, cross-compile, rewire-by-build-flags, meta, sanitizers, fuzz, coverage, hil-build, backend-test, arduino-lint, workflow-lint]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          case "${{ join(needs.*.result, ',') }}" in
            *failure*|*cancelled*) echo "Required CI jobs did not all pass."; exit 1;;
          esac
          echo "All required CI jobs passed."

  release:
    name: Release on green main
    runs-on: ubuntu-latest
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('library.json'))['version'])")"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad version: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build notes from CHANGELOG
        if: steps.exists.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md").read()
          m = re.search(
              r"^## \[%s\] - \d{4}-\d{2}-\d{2}\n(.*?)(?=^## \[|\Z)" % re.escape(version),
              text, re.M | re.S)
          body = m.group(1).strip() if m else ""
          open("/tmp/notes.md", "w").write(body + "\n" if body else "")
          print("changelog notes:", "found" if body else "missing (will use generated notes)")
          EOF
      - name: Create release
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -s /tmp/notes.md ]; then ARGS="--notes-file /tmp/notes.md"; else ARGS="--generate-notes"; fi
          # shellcheck disable=SC2086
          gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" $ARGS
