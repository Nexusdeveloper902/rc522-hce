; ESP32-RC522-HCE — PlatformIO project file.
; `pio test -e native` runs the host-side unit tests (no board needed).
; The esp32 example envs build the Arduino sketches in examples/.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_src_filter = +<*>
test_build_src = yes

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
build_flags =
    -DMFRC522_SPICLOCK=1000000u
lib_deps =
    miguelbalboa/MFRC522@^1.4.11

[env:esp32cam-reader]
platform = espressif32
framework = arduino
board = esp32cam
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DMFRC522_SPICLOCK=1000000u
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
